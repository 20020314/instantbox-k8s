# instantbox on Kubernetes —— Bun 一体化版本
#
# 架构（只有一个应用镜像）：
#   Deployment instantbox   —— Bun 进程同时是：
#                               * 前端（JSX 服务端渲染，无构建步骤）
#                               * 控制面（用 ServiceAccount 调 k8s API 建/删 Pod）
#                               * 网关（/console/<pod> 的 HTTP + WebSocket 反代）
#                               * 回收器（进程内定时扫过期沙箱）
#
# 相比上一版去掉的东西：nginx、Caddy、React 构建、prune CronJob、两个额外镜像。
# 只保留一个 Deployment + 一个 NodePort Service + RBAC + ConfigMap。
#
# 应用：
#   kubectl apply -f instantbox-k8s.yaml
---
apiVersion: v1
kind: Namespace
metadata:
  name: instantbox
---
# ---------------------------------------------------------------- 权限
# 只给最小权限：Pod 的增删查改 + Service 的增删查，且仅限本 namespace。
# 沙箱 Pod 本身 automountServiceAccountToken=false，拿不到任何集群凭据。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: instantbox-server
  namespace: instantbox
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: instantbox-pod-manager
  namespace: instantbox
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete", "patch"]
  # 每个沙箱配一个同名 headless Service，网关才能按名字解析到 Pod IP
  # （K8s 不为裸 Pod 建 A 记录）
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "create", "delete"]
  # 排查建 Pod 失败时能看到事件
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: instantbox-pod-manager
  namespace: instantbox
subjects:
  - kind: ServiceAccount
    name: instantbox-server
    namespace: instantbox
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: instantbox-pod-manager
---
# ---------------------------------------------------------------- 配置
apiVersion: v1
kind: ConfigMap
metadata:
  name: instantbox-config
  namespace: instantbox
data:
  INSTANTBOX_POD_NAMESPACE: "instantbox"
  INSTANTBOX_PREFIX: "instantbox-managed-"
  INSTANTBOX_SERVER_PORT: "65501"
  INSTANTBOX_TTYD_PORT: "1588"
  # 留空 = 用同域相对路径 /console/<pod>（默认，不需要 DNS 泛解析）
  INSTANTBOX_CONSOLE_DOMAIN: ""
  INSTANTBOX_SCHEME: "http"
  INSTANTBOX_CONSOLE_PORT: ""
  # 内网 harbor 代理前缀，例如 harbor.local/dockerhub/；留空则直连
  INSTANTBOX_IMAGE_PREFIX: ""
  # 沙箱镜像 tag 是 :latest。配 IfNotPresent 时节点上有旧缓存就永远不更新
  # （改完沙箱 Dockerfile 重建镜像，新建的沙箱跑的还是老镜像，极难发现）。
  # 实测踩过一次，所以这里用 Always。
  INSTANTBOX_IMAGE_PULL_POLICY: "Always"
  # 空闲多少秒没访问就回收，0 = 只按 TTL 回收
  INSTANTBOX_IDLE_TIMEOUT: "0"
  # 进程内回收扫描间隔（秒）。0 = 关闭，改用外部 CronJob 打 /api/v2/superinspire/prune
  INSTANTBOX_SWEEP_INTERVAL: "60"
  INSTANTBOX_MAX_CPU_MILLI: "4000"
  INSTANTBOX_MAX_MEM_MB: "4096"
  # 有 gvisor/kata 建议填上；k3s 默认没有 gvisor RuntimeClass
  INSTANTBOX_RUNTIME_CLASS: ""
---
# ---------------------------------------------------------------- 应用（唯一部署）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: instantbox
  namespace: instantbox
  labels: {app: instantbox}
spec:
  replicas: 2
  selector:
    matchLabels: {app: instantbox}
  template:
    metadata:
      labels: {app: instantbox}
    spec:
      serviceAccountName: instantbox-server
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        # oven/bun 镜像里的 bun 用户是 UID 1000
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: app
          image: ghcr.io/20020314/instantbox-server:latest
          # 用 :latest 必须 Always，否则节点上留着旧镜像就永远不更新。
          # 判断「到底跑的是不是新镜像」要看 imageID 的 digest，不是 tag。
          imagePullPolicy: Always
          envFrom:
            - configMapRef: {name: instantbox-config}
          ports:
            - {name: http, containerPort: 65501}
          readinessProbe:
            # readyz 会真的列一次沙箱 Pod：SA 权限配错 / 集群不可达时不接流量
            httpGet: {path: /readyz, port: 65501}
            initialDelaySeconds: 2
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            # healthz 只表示进程活着，避免集群抖动导致应用被反复重启
            httpGet: {path: /healthz, port: 65501}
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 5
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits:   {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
---
apiVersion: v1
kind: Service
metadata:
  name: instantbox
  namespace: instantbox
spec:
  # 对外入口。NodePort 还是 LoadBalancer 按你们集群改
  type: NodePort
  selector: {app: instantbox}
  ports:
    - name: http
      port: 80
      targetPort: 65501
      nodePort: 30888
