name: build-images

# 推 tag / 手动触发。镜像推到 GitHub Container Registry（ghcr.io），
# 用内置的 GITHUB_TOKEN，不需要另配 secret。
#
# 想推 Docker Hub：在仓库 Secrets 里加 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN，
# 然后把 REGISTRY 改成 docker.io/<你的用户名>。

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'server/**'
      - 'frontend/**'
      - 'sandbox/**'
      # deploy/ 必须算进去：清单校验是 server-test 的一部分，
      # 漏掉它的话「只改 yaml」不会触发 CI —— 而清单恰恰是最该被校验的东西。
      - 'deploy/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'server/**'
      - 'frontend/**'
      - 'sandbox/**'
      - 'deploy/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # 后端单测：用假 client，不连集群；顺带离线校验 k8s 清单
  server-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install deps
        working-directory: server
        run: pip install -r requirements.txt pytest pyyaml
      - name: Unit tests
        working-directory: server
        run: pytest test_manager.py -q
      - name: Validate k8s manifest offline
        working-directory: deploy
        run: python validate_manifest.py ./instantbox-k8s.yaml

  # 前端：装依赖 + 语法检查 + 真实构建（验证改动真的能编译）
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        working-directory: frontend
        env:
          npm_config_registry: https://registry.npmmirror.com
        run: |
          # node-sass 在 linux 上能装预编译包；装不上也没关系（optional）
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - name: Map sass-loader to dart-sass
        working-directory: frontend
        run: node patch-sass-loader.js
      - name: Syntax check (babel parser)
        working-directory: frontend
        run: |
          node -e '
          const parser = require("@babel/parser");
          const fs = require("fs"), path = require("path");
          const walk = d => fs.readdirSync(d, {withFileTypes: true}).flatMap(e => {
            const p = path.join(d, e.name);
            return e.isDirectory() ? walk(p) : (p.endsWith(".js") ? [p] : []);
          });
          let bad = 0;
          for (const f of walk("src")) {
            try {
              parser.parse(fs.readFileSync(f, "utf8"), {
                sourceType: "module", plugins: ["jsx", "classProperties", "classPrivateProperties"]
              });
            } catch (e) { console.error("SYNTAX", f, e.message); bad++; }
          }
          if (bad) process.exit(1);
          console.log("all js files parse OK");
          '
      - name: Production build
        working-directory: frontend
        env:
          CI: 'false'
          NODE_OPTIONS: '--openssl-legacy-provider'
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build
          retention-days: 3

  build-server:
    needs: [server-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/instantbox-server
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: ./server
          # 目标集群是 arm64（NVIDIA Spark / GB10），同时保留 amd64 兼容 x86 集群
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PIP_INDEX_URL=https://mirrors.aliyun.com/pypi/simple/
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

  # ------------------------------------------------------------------ 镜像 A：纯静态前端
  build-frontend-web:
    needs: [frontend-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/instantbox-frontend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          target: web
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NPM_REGISTRY=https://registry.npmmirror.com
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ------------------------------------------------------------------ 镜像 B：边缘网关（Caddy）
  # 同一个 Dockerfile 的 gateway target，复用 builder 层的构建缓存。
  build-gateway:
    needs: [frontend-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/instantbox-gateway
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      # 装 qemu（binfmt），让 CI 里能真的跑起来 arm64 的镜像做冒烟测试。
      # buildx 交叉编译只能证明「编得出来」，证明不了「跑得起来」——
      # 这次线上 exec /usr/bin/caddy: operation not permitted 就是后者。
      # --load 一次只能装一种架构，所以先按 arm64（线上实际架构）load 出来跑，
      # 再单独做多架构推送。
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build gateway (arm64, load locally)
        uses: docker/build-push-action@v6
        continue-on-error: true
        with:
          context: ./frontend
          target: gateway
          platforms: linux/arm64
          load: true
          tags: instantbox-gateway:prime
          build-args: |
            NPM_REGISTRY=https://registry.npmmirror.com
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      # 冒烟测试：镜像最基本的承诺就是「caddy 能在这个架构上跑起来」。
      # 构建期直接执行，不绿就不推 —— 免得线上看到
      # exec /usr/bin/caddy: operation not permitted 再回头猜。
      - name: Smoke test caddy binary
        run: |
          set -eux
          docker run --rm --platform linux/arm64 --entrypoint /usr/bin/caddy \
            instantbox-gateway:prime version

      - name: Build & push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          target: gateway
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NPM_REGISTRY=https://registry.npmmirror.com
          cache-from: type=gha,scope=frontend

  # ------------------------------------------------------------------ 沙箱镜像
  # Docker Hub 的 instantbox/* 只有 amd64，arm64 节点上 no match for platform。
  # 这里用多架构官方基础镜像重建同款（ttyd:1588 + bash），逐个版本推 ghcr。
  # 新增/删除版本时同步改下面的 matrix 和 server/manifest.json。
  build-sandbox:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # name 是推到 ghcr 的仓库名（不含 registry/owner 前缀），
          # base 是上游官方镜像（ttyd 版本等保持一致）
          - { name: sandbox-ubuntu-22.04, base: 'ubuntu:22.04' }
          - { name: sandbox-ubuntu-20.04, base: 'ubuntu:20.04' }
          - { name: sandbox-ubuntu-24.04, base: 'ubuntu:24.04' }
          - { name: sandbox-debian-12,   base: 'debian:12' }
          - { name: sandbox-alpine-3.20, base: 'alpine:3.20', family: alpine }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
      - uses: docker/build-push-action@v6
        with:
          context: ./sandbox
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE=${{ matrix.base }}
            APT_MIRROR=
          cache-from: type=gha,scope=sandbox-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=sandbox-${{ matrix.name }}
