name: build-images

# 推 tag / 手动触发。镜像推到 GitHub Container Registry（ghcr.io），
# 用内置的 GITHUB_TOKEN，不需要另配 secret。
#
# 现在的产物只有两个：
#   instantbox-server    应用本体（控制面 + 前端 + 网关 + 回收器，一个 Bun 进程）
#   instantbox-sandbox-*  各发行版沙箱（ttyd:1588）
#
# 前端不再单独构建：页面是 JSX，Bun 运行时直接编译，没有 webpack/npm 步骤。

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'server-bun/**'
      - 'sandbox/**'
      - 'deploy/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'server-bun/**'
      - 'sandbox/**'
      - 'deploy/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # ------------------------------------------------------------------ 单测 + 清单校验
  # 用 Bun 跑：不需要 pip / pytest / node，一条 bun test 全包。
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2'

      - name: Install dev deps (typecheck only)
        working-directory: server-bun
        run: bun install --frozen-lockfile || bun install

      - name: Unit tests
        working-directory: server-bun
        run: bun test

      - name: Typecheck
        working-directory: server-bun
        # 类型错误不该阻塞发版，但要看得到
        continue-on-error: true
        run: bunx tsc --noEmit

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Validate k8s manifest offline
        working-directory: deploy
        run: |
          pip install kubernetes pyyaml
          python validate_manifest.py ./instantbox-k8s.yaml

  # ------------------------------------------------------------------ 应用镜像
  build-server:
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/instantbox-server
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: ./server-bun
          # 目标集群是 arm64（NVIDIA Spark / GB10），同时保留 amd64 兼容 x86 集群
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

  # ------------------------------------------------------------------ 沙箱镜像
  # Docker Hub 的 instantbox/* 只有 amd64，arm64 节点上 no match for platform。
  # 这里用多架构官方基础镜像重建同款（ttyd:1588 + bash + -W），逐个版本推 ghcr。
  # 新增/删除版本时同步改下面的 matrix 和 server-bun/manifest.json。
  build-sandbox:
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # name 是推到 ghcr 的仓库名（不含 registry/owner 前缀），
          # base 是上游官方镜像（ttyd 版本等保持一致）
          - { name: sandbox-ubuntu-22.04, base: 'ubuntu:22.04' }
          - { name: sandbox-ubuntu-20.04, base: 'ubuntu:20.04' }
          - { name: sandbox-ubuntu-24.04, base: 'ubuntu:24.04' }
          - { name: sandbox-debian-12,   base: 'debian:12' }
          - { name: sandbox-alpine-3.20, base: 'alpine:3.20', family: alpine }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
      - uses: docker/build-push-action@v6
        with:
          context: ./sandbox
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
