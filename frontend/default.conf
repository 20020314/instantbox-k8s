server {
    listen 8080;

    # 沙盒 Pod 名形如 instantbox-managed-xxxxxxxxxxxx，绝不能带点/斜杠，防 SSRF
    # 同时只允许 <prefix>* 的名字，避免把任意 Service 名拼进来

    # ------------------------------------------------------------------ 前端静态
    location / {
        root  /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # ------------------------------------------------------------------ 控制面 API
    location /api {
        limit_req zone=instantbox_api burst=20 nodelay;
        rewrite ^/api/?(.*) /$1 break;
        proxy_pass http://server:65501;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 建 Pod 是同步调用，集群忙的时候可能要等几百毫秒，给宽一点
        proxy_connect_timeout 5s;
        proxy_read_timeout    35s;
        proxy_send_timeout    35s;
    }

    # ------------------------------------------------------------------ 沙箱 webshell
    # /console/<pod-name>[/...]  ->  http://<pod-name>:1588/[...]
    # 目标主机名由 K8s DNS 解析（同一命名空间内 Pod 名即主机名），
    # 因此 worker 必须和沙箱 Pod 部署在同一 namespace（或手改 resolver 指向 headless svc）。
    location ~ ^/console/(instantbox-managed-[a-z0-9]{4,40})(/.*)?$ {
        set $pod_name  $1;
        set $console_upstream http://$pod_name:1588;

        # 关闭默认 resolver（127.0.0.11 是 docker 内嵌 DNS，K8s 下是 NodeLocal DNS 或集群 DNS）
        resolver kube-dns.kube-system.svc.cluster.local valid=10s ipv6=off;
        resolver_timeout 3s;

        # 变量形式的 proxy_pass 必须自己拼 URI：把 /console/<pod> 之后的剩余路径透传
        rewrite ^/console/[^/]+(/.*)?$ $1 break;
        proxy_pass $console_upstream;

        proxy_http_version 1.1;
        # 让 ttyd 自己按 X-Forwarded-* 判断协议；默认会把它当 http，https 下 WS 会失败
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;

        # ttyd 的 WebSocket
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # 交互式 shell 可能长时间无输出
        proxy_buffering off;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # ------------------------------------------------------------------ 健康检查
    location = /healthz {
        access_log off;
        return 200 'ok';
    }
}
