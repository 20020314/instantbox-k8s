server {
    listen 8080;

    # 沙盒 Pod 名形如 instantbox-managed-xxxxxxxxxxxx，绝不能带点/斜杠，防 SSRF
    # 同时只允许 <prefix>* 的名字，避免把任意 Service 名拼进来

    # ------------------------------------------------------------------ 前端静态
    location / {
        root  /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # ------------------------------------------------------------------ 控制面 API
    location /api {
        limit_req zone=instantbox_api burst=20 nodelay;
        rewrite ^/api/?(.*) /$1 break;
        proxy_pass http://server:65501;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 建 Pod 是同步调用，集群忙的时候可能要等几百毫秒，给宽一点
        proxy_connect_timeout 5s;
        proxy_read_timeout    35s;
        proxy_send_timeout    35s;
    }

    # ------------------------------------------------------------------ 沙箱 webshell
    # /console/<pod-name>[/...]  ->  http://<pod-name>.<ns>.svc.cluster.local:1588/[...]
    # 裸 Pod 没有 A 记录（Docker compose 才有），所以 server 端给每个沙箱建了
    # 一个同名 headless Service，名字解析就是靠它。
    # 正则必须加引号：nginx 会把 { 后面跟字母当成变量名（$4,...）的起始，
    # 于是 {4,40} 被截断，pcre2 报 "missing closing parenthesis" 直接起不来。
    location ~ "^/console/(instantbox-managed-[a-z0-9]{4,40})(/.*)?$" {
        set $pod_name  $1;

        # 必须是 FQDN，不能写短名。
        # nginx 的 resolver 直接向 DNS 发查询，不做 search 域补全（那是 glibc/musl
        # 的 getaddrinfo 行为）。写短名时 nginx 查的是 "pod-name."，CoreDNS 无此记录，
        # 报 "could not be resolved (3: Host not found)"。
        # namespace 与清单里 INSTANTBOX_POD_NAMESPACE 一致（默认 instantbox）。
        set $console_upstream http://$pod_name.instantbox.svc.cluster.local:1588;

        # resolver 地址不能用集群域名（kube-dns.kube-system.svc...）：
        # nginx 需要它时还没有可用的 resolver 去解析它，实测直接解析失败。
        # 用 k3s 集群 DNS 的固定 ClusterIP（kubectl -n kube-system get svc kube-dns）。
        resolver 10.43.0.10 valid=10s ipv6=off;
        resolver_timeout 3s;

        # 变量形式的 proxy_pass 必须自己拼 URI：把 /console/<pod> 之后的剩余路径透传
        rewrite "^/console/[^/]+(/.*)?$" $1 break;
        proxy_pass $console_upstream;

        proxy_http_version 1.1;
        # 让 ttyd 自己按 X-Forwarded-* 判断协议；默认会把它当 http，https 下 WS 会失败
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;

        # ttyd 的 WebSocket
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # 交互式 shell 可能长时间无输出
        proxy_buffering off;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # ------------------------------------------------------------------ 健康检查
    location = /healthz {
        access_log off;
        return 200 'ok';
    }
}
