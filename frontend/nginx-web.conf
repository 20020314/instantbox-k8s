# 纯静态前端（镜像 frontend-web 用）
# 只做一件事：把 CRA 构建产物发出去，SPA 路径回落到 index.html。
# /api 和 /console 的反代不在这里——那是 gateway（Caddy）的活。
server {
    listen 8080;

    root  /usr/share/nginx/html;
    index index.html;

    # 带 contenthash 的资源长缓存
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # index.html 不缓存，避免发版后用户拿着旧的资源清单
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA 兜底
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        return 200 'ok';
    }
}
